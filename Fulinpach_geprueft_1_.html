  /* Papierterminal: jedes Motiv und jedes Statuszeichen wird aus ASCII gesetzt.

<body>
<div id="app">
  <h1 id="title">FULINPACH</h1>
  <div class="subtitle">EIN APFEL-ABENTEUER IN BAD FEILNBACH · inspiriert von klassischen ASCII-Adventures</div>

  <div id="resources" class="resource-row"></div>
  <div id="topActions"></div>
  <div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="bar"></div>
  <div id="tabs" class="tabs"></div>

  <section id="panel-main" class="panel active">
    <div id="mainStage" class="main-stage"><pre id="mainArt" class="scene-art" role="img" aria-label="Apfelkiste am Rathausplatz"></pre><div id="mainHotspots" class="scene-hotspots"></div></div>
    <pre id="mainStory" class="story"></pre>
    <div id="mainActions"></div>
    <details class="history"><summary>Erlebnisse nachlesen</summary><div id="log" class="log"></div></details>
  </section>

  <section id="panel-shop" class="panel"><div id="shop"></div></section>
  <section id="panel-farm" class="panel"><div id="farm"></div></section>
  <section id="panel-inventory" class="panel"><div id="inventory"></div></section>
  <section id="panel-map" class="panel"><div id="map"></div></section>
  <section id="panel-journal" class="panel"><div id="journal"></div></section>
  <section id="panel-quests" class="panel"><div id="questHint" class="quest-hint"></div><div class="scene-stage"><pre id="locationArt" class="scene-art" role="img"></pre><div id="questHotspots" class="scene-hotspots"></div></div><div id="lorePanel"></div><div id="encounterPanel"></div><div id="quests"></div></section>
  <section id="panel-box" class="panel"><div id="box"></div></section>
  <section id="panel-save" class="panel"><div id="save"></div></section>

  <div class="footer">Autosave lokal. Kein Server. Kein Konto. Ein Wegbuch voller Äpfel, Wasser und alter Namen.</div>
</div>

<script>
(() => {
  "use strict";
  const SAVE_KEY = "fulinpach_bad_feilnbach_v3";
  const OLD_SAVE_KEY = "candy_box_3_bad_feilnbach_de_v2";
  const VERSION = 11;
  const $ = id => document.getElementById(id);

  const EQUIPMENT_SLOTS = [

  const fresh = () => ({

  function asciiGraphic(className,label,art){
    const node=document.createElement("pre");node.className=className;
    node.setAttribute("role","img");node.setAttribute("aria-label",label);
    node.textContent=art;return node;
  }
  function itemGraphic(id,extraClass=""){
    const art=asciiGraphic(`item-art ${extraClass}`.trim(),itemDb[id]?.name||shopItems.find(x=>x.id===id)?.label||id,ITEM_ART[id]||"[?]");
    art.setAttribute("data-item",id);return art;
  }

  function gearSlot(id){
    const it=itemDb[id];
    return it?.slot || (it?.type==="weapon"?"weapon":it?.type==="trinket"?"trinket":null);
  }

  function addItem(id){
    if(!g.inventory.includes(id)){
      g.inventory.push(id); g.unlocks.inventory = true;
      say(`Du erhältst: ${itemDb[id]?.name || id}.`, "good");
      const it=itemDb[id], slot=gearSlot(id);
      if(slot && (!g.equipped[slot] || (it.damage||0)>(itemDb[g.equipped[slot]]?.damage||0) && slot==="weapon")){
        g.equipped[slot]=id; recomputeStats();
        say(`${it.name} ist am Platz ${EQUIPMENT_SLOTS.find(s=>s.id===slot).label} angelegt. Schaden: ${g.damage}, Schutz: ${g.defense}.`, "good");
      }
    }
  }
  function has(id){ return g.inventory.includes(id); }
  function say(msg, cls=""){
    const entry=(cls?`[${cls}] `:"")+msg;
    g.messages.push(entry);
    if(g.messages.length>90) g.messages.shift();

  function updateUnlocks(){

    }
    if((g.apples >= 25 || g.thrown>0) && !g.unlocks.throw){
      g.unlocks.throw = true; say("Du kannst Äpfel für die Krähe auslegen. Sie beobachtet dich bereits.");
    }
    if((g.apples >= 40 || g.thrown >= 20) && !g.flags.wrapperSeen && !g.unlocks.wrapper){

  function eatApples(){
    const amt = Math.max(1, Math.min(20, Math.floor(g.apples)));
    if(!spend("apples", amt)) return;
    g.eaten += amt;
    const old = g.maxHp;
    g.maxHp = 100 + g.insuranceBonus + Math.floor(g.eaten / 20) * 2 + (g.flags.candleLit?10:0);
    g.hp = Math.min(g.maxHp, g.hp + Math.ceil(amt/2));
    say(`Du isst ${amt} Äpfel. Ein Obstbauer nickt anerkennend. Nach dem zwanzigsten Apfel nicht mehr.`);
    if(g.maxHp>old) say("Deine maximalen LP steigen. Obst ist jetzt offenbar Medizin.","good");
    render();
  }

  function leaveApples(){
    if(!spend("apples", 10)) return;

  function buy(si){
    if(!si.repeat && g.shopBought[si.id]) return;
    if(!canAfford(si.cost)) return;
    for(const [k,v] of Object.entries(si.cost)) g[k]-=v;
    if(!si.repeat) g.shopBought[si.id]=true;
    si.action(); render(); saveGame();

  function equipSlot(slot,id){
    if(!EQUIPMENT_SLOTS.some(s=>s.id===slot))return;
    if(id && (!has(id) || gearSlot(id)!==slot))return;
    if(g.equipped[slot]===id)return;
    g.equipped[slot]=id||null;
    recomputeStats();
    say(`${EQUIPMENT_SLOTS.find(s=>s.id===slot).label}: ${id?itemDb[id].name:"leer"}. Schaden ${g.damage}, Schutz ${g.defense}.`,"good");
    render(); saveGame();
  }
  function recomputeStats(){
    g.damage=2; g.defense=0;
    for(const {id} of EQUIPMENT_SLOTS){
      const it=itemDb[g.equipped[id]];
      if(it?.damage)g.damage+=it.damage;
      if(it?.defense)g.defense+=it.defense;
    }
  }

  function solveOster(method){
    const w=g.water.oster;if(g.location!=="biberdamm"||w.stage!=="assessed")return;

  function combatTick(now){
    if(!g.combat)return;
    const e=enemies[g.combat.id];
    if(now>=g.combat.nextPlayer){
      g.combat.enemyHp-=g.damage; g.combat.nextPlayer=now+850;g.combat.lastHit=now;
      if(g.combat.enemyHp<=0){
        finishCombat(e); return;
      }
    }
    if(g.combat && now>=g.combat.nextEnemy){
      const dmg=Math.max(1,e.damage-g.defense); g.hp-=dmg; g.combat.nextEnemy=now+e.interval;g.combat.lastHurt=now;
      if(g.hp<=0){
        g.stats.deaths++; g.hp=g.maxHp;
        say(`Du wurdest von ${e.name} besiegt. Du wachst am Rathausplatz auf. Neben dir liegt ein Formular, das du nicht bestellt hast.`,"bad");
        g.combat=null; g.location="rathaus";
        saveGame();
      }
    }
  }

    } else if(s.includes("faul")) {
      say("„Fulinpah” heißt wörtlich fauler Bach, auf Englisch: lazy creek. Ein Spiel, in dem man wartet, bis Äpfel wachsen, spielt ausgerechnet dort. Die Kiste findet das auch bemerkenswert.","secret");
    } else if(s.includes("kurbeitrag") || s.includes("steuer")) {

      g.flags.boxOpened=true; addItem("hollowApple"); g.stats.secrets++;

  function renderResources(){
    const r=$("resources");
    const parts=[["apples","Äpfel",g.apples,`+${g.appleRate.toFixed(1)}/s`]];
    if(g.shopBought.seedCollector || g.seeds>0) parts.push(["seeds","Apfelkerne",g.seeds,`+${g.seedRate.toFixed(1)}/s`]);
    if(g.cider>0) parts.push(["cider","Mostflaschen",g.cider,""]);
    if(g.bark>0 || g.flags.wrapperSeen) parts.push(["bark","Rindenzeichen",g.bark,""]);
    parts.push(["hp","LP",`${Math.ceil(g.hp)}/${g.maxHp}`,""]);
    if(r.children.length!==parts.length || parts.some(([key],i)=>r.children[i]?.resourceKey!==key)){
      r.innerHTML="";
      for(const [key] of parts){
        const d=document.createElement("div");d.className="resource";d.resourceKey=key;
        d.appendChild(resourceGraphic(key));d.appendChild(document.createElement("span"));r.appendChild(d);
      }
    }
    for(let i=0;i<parts.length;i++){
      const [,name,val,extra]=parts[i];
      const label=r.children[i].children[1];
      const value=`${name}: ${typeof val==="number"?fmt(val):val} ${extra}`.trim();
      if(label.textContent!==value)label.textContent=value;
    }
  }

  const CHRONICLE=[
    {id:"fulinpah980",phase:1,place:"rathaus",date:"980",title:"Fulinpah und der langsame Bach",
      paragraphs:["Im Jahr 980 taucht Feilnbach erstmals urkundlich als „Fulinpah“ auf. Der Name wird als „fauler Bach“ gedeutet: gemeint ist ein träge oder langsam fließendes Gewässer. Namen bewahren damit einen Blick auf die Landschaft, der lange vor den heutigen Straßenschildern entstand.","Der Jenbach setzt einen hörbaren Gegenpol. Die Gemeindechronik erklärt seinen Namen als „jähen Bach“ und beschreibt ihn als wild und ungestüm. Von den Vorbergen des Wendelsteinmassivs reichen die Gemeindeflächen bis in die Filz- und Moorgebiete des Rosenheimer Beckens. Wenn du den Namen Fulinpach in der Kiste liest, denke an diese beiden unterschiedlichen Wasserläufe."],
      question:"Welche beiden Bachbilder gehören in deine Notiz?",answers:["Fulinpah: langsam; Jenbach: jäh.","Fulinpah: jäh; Jenbach: langsam."],correct:0,
      source:"Gemeinde Bad Feilnbach · Gemeindechronik",url:"https://www.bad-feilnbach.de/buerger-und-rathaus/gemeindechronik/"},
    {id:"wappen1391",phase:1,place:"kirche",date:"1391 / 1965",title:"Kirche und Wellenbalken im Wappen",
      paragraphs:["Das Gemeindewappen zeigt über einem silbernen Wellenbalken eine silberne Kirche. Die Kirche nimmt das Wappen der Herren von Diepertskirchen auf, die mit der mittelalterlichen Geschichte des Ortes verbunden waren. Ihre Wappenform ist auf einem Grabstein von 1391 überliefert.","Der Wellenbalken spricht den Ortsnamen aus: Er verweist auf Feilnbach, das frühere Fulinpah und den langsamen Bach. Erst 1965 erhielt die Gemeinde die Zustimmung, dieses Wappen zu führen. So stehen ein mittelalterliches Zeichen und der Wassername gemeinsam auf einem jüngeren amtlichen Bild."],
      question:"Was verbindet die beiden Teile des Wappens?",answers:["Ein alter Bahnfahrplan und der Apfelmarkt.","Die Kirche der Diepertskirchener und der Bach im Ortsnamen."],correct:1,
      source:"Gemeinde Bad Feilnbach · Wappenbeschreibung",url:"https://www.bad-feilnbach.de/buerger-und-rathaus/buergermeisterbuero/"},
    {id:"bahn1897",phase:1,place:"bahnhof",date:"1897–1973",title:"Die elektrische Bahn nach Feilnbach",
      paragraphs:["Am 29. Mai 1897 wurde die Strecke zwischen Bad Aibling und dem damaligen Feilenbach feierlich eingeweiht. Sie gehörte zu den frühen elektrifizierten Eisenbahnen Bayerns. Mit ihr änderte sich, wie Waren und Gäste den Ort erreichten; die Gemeindechronik verbindet die Bahn mit wirtschaftlichem Aufschwung entlang der Strecke.","Im September 1973 endete der Betrieb aus wirtschaftlichen Gründen. Das ist dasselbe Jahr, in dem Feilnbach den Zusatz „Bad“ erhielt. Am ehemaligen Bahnhof begegnen sich daher zwei Bewegungen: ein Verkehrsweg verschwindet, während der Kurort seinen Namen erweitert. Teile der ehemaligen Trasse sind heute als Radweg erlebbar."],
      question:"Welche beiden Ereignisse gehören zum Jahr 1973?",answers:["Erste Erwähnung und Bau der Kapelle.","Ende der Lokalbahn und Erhebung zum Bad."],correct:1,
      source:"Gemeinde Bad Feilnbach · Gemeindechronik",url:"https://www.bad-feilnbach.de/buerger-und-rathaus/gemeindechronik/"},
    {id:"moor1900",phase:1,place:"filze",date:"seit 1900",title:"Das Moor und der Kurort",
      paragraphs:["Die reichhaltigen Moorvorkommen wurden seit etwa 1900 zur Grundlage für den Ausbau der Kureinrichtungen. Das „schwarze Gold“ prägte die Entwicklung zur Kur- und Fremdenverkehrsgemeinde. 1973 wurde Feilnbach zum Bad erhoben. Wer heute auf einem Bohlenweg steht, sieht also auch einen Teil der Wirtschafts- und Gesundheitsgeschichte des Ortes.","In den Sterntaler Filzen erinnert ein Torfstadel an den Abbau. Dort werden historische Werkzeuge gezeigt; ein Schauhandtorfstich erklärt die Arbeit im Moor. Der Boden ist zugleich Lebensraum. Den Weg zu respektieren heißt, die Spuren früherer Nutzung zu verstehen und die heutige Landschaft zu schonen."],
      question:"Wodurch wuchsen die Kureinrichtungen seit etwa 1900?",answers:["Durch die Moorvorkommen.","Durch einen neuen Gipfelbahnhof."],correct:0,
      source:"Gemeindechronik und Moorerlebnis Sterntaler Filze",url:"https://www.bad-feilnbach.de/kur-und-tourismus/themenwege/moorerlebnis-sterntaler-filze/"},
    {id:"gemeinde1978",phase:2,place:"au",date:"1972 / 1978",title:"Aus mehreren Gemeinden wird Bad Feilnbach",
      paragraphs:["Die heutige Gemeinde entstand während der Gebietsreform in den Jahren 1972 und 1978. Die Gemeindechronik nennt als Teile Feilnbach, Wiechs, Au bei Bad Aibling, Dettendorf und Litzldorf. Auf der Karte liegen sie nicht wie Häuser an einer einzigen Straße: Jeder Ort hat einen eigenen Mittelpunkt und eine eigene Vergangenheit.","An der Taxakapelle in Au merkst du, wie viel Geschichte ein heutiger Gemeindename zusammenfasst. Die Bezeichnung „Bad Feilnbach“ steht für eine Verwaltungseinheit; die Namen Au, Wiechs oder Litzldorf bleiben dennoch wichtig, wenn Menschen Wege erklären, Feste feiern oder von früher erzählen. Eine Ortschronik besteht gerade aus diesen Stimmen nebeneinander."],
      question:"Welche Orte nennt die Gemeindechronik bei der Entstehung?",answers:["Feilnbach, Wiechs, Au, Dettendorf und Litzldorf.","Nur Feilnbach und Au."],correct:0,
      source:"Gemeinde Bad Feilnbach · Gemeindechronik",url:"https://www.bad-feilnbach.de/buerger-und-rathaus/gemeindechronik/"},
    {id:"apfel1992",phase:2,place:"markt",date:"seit 1992",title:"Streuobst und Apfelmarkt",
      paragraphs:["Rund 25.000 Bäume im Streuobstanbau prägen nach Angaben der Gemeinde die Kulturlandschaft um Bad Feilnbach. Obstbau ist für landwirtschaftliche Betriebe ein zusätzlicher Erwerbszweig und zugleich ein sichtbarer Teil der Landschaft. Alte Sorten und unterschiedliche Ernten gehören zu den Gründen, warum hier Äpfel weit mehr sind als eine Spielwährung.","1992 wurde erstmals zum Bad Feilnbacher Apfelmarkt eingeladen. Aus der Idee zur Vermarktung heimischen Obstes wurde ein weithin bekannter Markt, der im Oktober stattfindet. Zwischen den Ständen gehen Sortennamen, Rezepte und Erfahrungen weiter. Im Wegbuch zählt deshalb nicht nur, wie viele Äpfel du gesammelt hast, sondern wem du ihre Geschichte erzählen kannst."],
      question:"Wofür stand der erste Apfelmarkt 1992?",answers:["Für die Einstellung der Bahn.","Für die Vermarktung heimischen Obstes."],correct:1,
      source:"Gemeindechronik und Gemeindezeitung 2023",url:"https://www.bad-feilnbach.de/buerger-und-rathaus/gemeindechronik/"},
    {id:"maler",phase:2,place:"wiechs",date:"19. Jahrhundert",title:"Leibl und Sperl in Kutterling",
      paragraphs:["Die Gemeindechronik nennt Wilhelm Leibl und Johann Sperl als Maler, die mehrere Jahre in Kutterling wirkten. Auf dem Weg zwischen Wiechs, den Obstwiesen und den kleineren Orten wird verständlich, weshalb eine Landschaft auch durch Bilder weiterlebt: Menschen sehen denselben Hang, aber wählen verschiedene Einzelheiten aus.","Kutterling ist nicht Wiechs. Der Eintrag beginnt hier, weil dein Wegbuch die benachbarten Orte verbindet. Nimm dir Zeit für den Blick über die Wiesen und zeichne dir einen Ausschnitt ein: den Baum, den Bach oder die Straße. Ein Bild bewahrt, was ein Verzeichnis von Namen allein nicht halten kann."],
      question:"Welche beiden Maler nennt die Gemeindechronik für Kutterling?",answers:["Leibl und Sperl.","Dientzenhofer und Fuetterer."],correct:0,
      source:"Gemeinde Bad Feilnbach · Gemeindechronik",url:"https://www.bad-feilnbach.de/buerger-und-rathaus/gemeindechronik/"},
    {id:"sterntaler",phase:2,place:"filze",date:"nach der Eiszeit / 2021",title:"Vom Rosenheimer See zum Moor",
      paragraphs:["Die Sterntaler Filze gehören zu den Rosenheimer Stammbeckenmooren. Nach dem Rückzug des Inngletschers bestand der Rosenheimer See; durch seine Verlandung entstanden Moorlandschaften. Torf bewahrt Spuren dieser langen Veränderung. Ein Gang durch die Filze führt deshalb durch eine Landschaft, die über sehr viel längere Zeiträume gewachsen ist als der Ort auf der Karte.","Heute leben dort seltene Pflanzen und Vögel; die örtliche Information nennt auch Moorfrosch und Wiesenweihe. 2021 wurde das Gebiet als Feuchtgebiet von internationaler Bedeutung ausgezeichnet. Bohlenweg, Vogelbeobachtung und Torfstadel erzählen zusammen von Nutzung und Schutz. Der Frosch im Spiel wird plötzlich zu einem guten Grund, beim Gehen genauer hinzusehen."],
      question:"Wie entstanden die Moorlandschaften laut der Ortsinformation?",answers:["Durch die Stilllegung der Eisenbahn.","Durch die Verlandung des Rosenheimer Sees."],correct:1,
      source:"Gemeinde Bad Feilnbach · Sterntaler Filze",url:"https://www.bad-feilnbach.de/kur-und-tourismus/themenwege/moorerlebnis-sterntaler-filze/"}
  ];
  function chronicleCount(phase){return CHRONICLE.filter(entry=>entry.phase===phase&&g.chronicle.solved.includes(entry.id)).length}
  let chronicleOpen=null;
  function solveChronicle(id,answer,feedback){
    const entry=CHRONICLE.find(x=>x.id===id);
    if(!entry||!g.chronicle.visited.includes(entry.place)||entry.phase===2&&!g.flags.ending)return;
    chronicleOpen=id;
    if(answer!==entry.correct){feedback.textContent="Schau noch einmal in den Text: Die Antwort steht in der Chronik.";return}
    if(!g.chronicle.solved.includes(id)){
      g.chronicle.solved.push(id);
      say(`Du hältst fest: ${entry.answers[answer]}`,"secret");
      if(chronicleCount(1)===2&&!g.flags.ending)say("Zwei Seiten der Ortschronik sind verstanden. Ihre Spuren führen zur Treppe.","good");
      if(chronicleCount(2)===2)say("Zwei weitere Seiten verbinden die Ernte mit dem alten Ortsnamen.","good");
    }
    saveGame();render();
  }

  function chooseEncounter(id,choiceId){
    const scene=ENCOUNTERS.find(x=>x.id===id),choice=scene?.choices.find(x=>x.id===choiceId);
    if(!scene||!choice||g.location!==scene.place||g.encounters[id]||g.combat)return;
    g.encounters[id]=choiceId;
    if(choice.apples)g.apples+=choice.apples;
    if(choice.seeds)g.seeds+=choice.seeds;
    if(choice.bark)g.bark+=choice.bark;
    say(choice.text,"secret");saveGame();render();
  }
  function renderEncounterPanel(){
    const panel=$("encounterPanel");panel.innerHTML="";
    if(g.combat)return;
    const scene=ENCOUNTERS.find(x=>x.place===g.location);
    if(!scene)return;
    const choice=scene.choices.find(x=>x.id===g.encounters[scene.id]);
    const card=document.createElement("section");card.className="encounter-card";
    const title=document.createElement("h3");title.textContent=`ERKUNDUNG · ${scene.title}`;card.appendChild(title);
    const text=document.createElement("p");text.textContent=choice?choice.text:scene.intro;card.appendChild(text);
    if(!choice)for(const option of scene.choices)card.appendChild(btn(option.label,()=>chooseEncounter(scene.id,option.id)));
    panel.appendChild(card);
  }

      intro:{rathaus:"Am Sockel der Apfelkiste sitzt eine Kerbe unter vielen Jahresringen.",bahnhof:"Neben der alten Bahntrasse liegt ein Grenzstein mit verwitterten Buchstaben."},
      story:{rathaus:"Du reibst Erde aus der Kerbe. Unter dem Schmutz steht FULINPAH. In einer Urkunde von 980 hieß Feilnbach so: der träge, der faule Bach. Warum hat jemand den Namen in eine Kiste geschnitten, die selbst Äpfel hervorbringt? Unter dem letzten Buchstaben führt eine feine Linie weiter wie ein Wasserlauf.",bahnhof:"Auf dem Stein treffen zwei Zeiten aufeinander. Ein Pfeil zeigt zur Bahn, die 1897 Bad Aibling und Feilnbach verband; darunter ist ein viel älteres Wort eingeritzt: FULINPAH. Die Schienen sind fort, der Name blieb. Die eingeritzte Linie endet dort, wo die Apfelwiesen beginnen."},
      choices:[{label:"Den Namen laut aussprechen",text:"Du sprichst Fulinpah. Im Holz der Kiste antwortet ein einzelner Tropfen, obwohl sie trocken ist."},{label:"Die Linie ins Wegbuch zeichnen",text:"Du zeichnest die geschwungene Linie ab. Sie ähnelt keinem Fahrplan, aber dem Verlauf eines langsamen Bachs."}]},

      choices:[{label:"Das Holz an seinem Platz lassen",text:"Du lässt das Holz liegen und merkst dir seine Ringe. Manches bleibt nur erhalten, wenn man es nicht mitnimmt."},{label:"Die Geschichte weitererzählen",text:"Du erzählst vom Holz und dem Bohlenweg. Das Moor gibt keine Antwort, aber jemand wird beim nächsten Gang auf den Weg achten."}]},
    {id:"water",title:"Zwei Bäche, ein Tal",chapter:1,places:["osterbach","jenbach"],

      story:{osterbach:"Kinder haben die Holzrinnen zu einem kleinen Flusssystem verbunden. Jetzt bleibt der erste Lauf trocken. Der Stein zeigt zwei Wellen: eine gerade und eine, die an einem Hindernis ausweicht. Wer Wasser zurückbringen will, muss verstehen, wo es hinfließt, ohne das Zuhause der Biber zu zerstören.",jenbach:"Der obere Strich stammt aus einer Nacht, über die niemand gern spricht. Unter dem zweiten hat jemand ein Haus und daneben einen Apfelbaum eingeritzt. Der Jenbach kann jäh werden; sein Name klingt schon wie eine Warnung. Beim nächsten Regen zählen zuerst die Menschen unterhalb der Brücke."},

    {id:"promise",title:"Das Gelübde von Au",chapter:2,places:["au","kirche"],

      story:{au:"Balthasar Fuetterer gab 1647 ein Gelübde ab, aus dem die Taxakapelle erwuchs. Der Name Taxa erinnert an 'Daxn', die Fichten- und Tannenzweige bei der Kapelle. Die Notiz erzählt von einer anderen Art Versprechen: Wer im Herbst erntet, lässt im Frühjahr etwas wachsen, das ihm selbst vielleicht nie gehören wird.",kirche:"Das Papier riecht nach Nadelholz. Ein Pilger hat von der Kapelle in Au und einem Gelübde aus dem Jahr 1647 geschrieben. Darunter steht, in anderer Hand: Ein Versprechen gilt auch, wenn niemand zusieht. Zwischen den Zeilen klebt ein winziger Apfelkern."},

    {id:"mountain",title:"Die Stimmen am Berg",chapter:2,places:["farrenpoint","wendelstein"],

  function loreCount(chapter){return LORE_THREADS.filter(thread=>thread.chapter===chapter&&g.lore.choices[thread.id]).length}
  function openLore(id){
    const thread=LORE_THREADS.find(x=>x.id===id&&x.places.includes(g.location));
    if(!thread||g.lore.opened[id])return;
    g.lore.opened[id]=g.location;
    say(`Du findest eine neue Spur: ${thread.title}.`,"secret");render();saveGame();
  }
  function chooseLore(id,index){
    const thread=LORE_THREADS.find(x=>x.id===id),choice=thread?.choices[index];
    if(!thread||!choice||!g.lore.opened[id]||g.lore.choices[id])return;
    g.lore.choices[id]=index+1;
    say(choice.text,"secret");
    if(thread.chapter===1&&loreCount(1)===3)say("Die drei Spuren treffen sich unter der Apfelkiste. Die Treppe wartet auf dich.","good");
    if(thread.chapter===2&&loreCount(2)===3)say("Die Wege von Markt, Kapelle und Berg führen zum langsamen Bach.","good");
    saveGame();render();
  }
  function renderLorePanel(){

    if(!thread)return;
    const card=document.createElement("section");card.className="lore-card";
    const title=document.createElement("h3");title.textContent=`WEGBUCH ${thread.chapter} · ${thread.title}`;card.appendChild(title);
    const body=document.createElement("p");

    body.textContent=g.lore.opened[thread.id]?thread.story[origin]:thread.intro[g.location];card.appendChild(body);
    if(!g.lore.opened[thread.id])card.appendChild(btn("Spur untersuchen",()=>openLore(thread.id)));
    else if(!g.lore.choices[thread.id])for(let i=0;i<thread.choices.length;i++)card.appendChild(btn(thread.choices[i].label,()=>chooseLore(thread.id,i)));
    else {const result=document.createElement("p");result.className="good";result.textContent=thread.choices[g.lore.choices[thread.id]-1]?.text||"Diese Spur ist in deinem Wegbuch.";card.appendChild(result)}

  function journalGo(entry){

      g.currentTab=entry.tab;render();return;
    }
    const p=entry.place;

    if(locked){g.currentTab="map";render();return}
    travel(p);

  function currentSceneKey(){
    if(g.location==="fulinpach"&&g.flags.finalChoice)return g.flags.finalChoice==="share"?"endingShare":"endingRest";
    if(g.location==="wall"&&g.flags.wallPassed)return g.flags.wallRoute==="path"?"wallPath":"wallOpen";
    if(g.location==="osterbach"&&g.water.oster.stage==="solved")return {fachstelle:"osterFachstelle",versorgung:"osterVersorgung",gemeinschaft:"osterGemeinschaft"}[g.water.oster.solution]||"osterFachstelle";
    if(g.location==="jenbach"&&g.water.oster.stage==="solved"&&g.flags.jenbachWon){
      if(g.water.flood.stage!=="solved")return "jenbachRain";
      return {treibholz:"jenbachClear",rueckhalt:"jenbachRetain",hausschutz:"jenbachProtect"}[g.water.flood.solution]||"jenbachSafe";
    }
    if(g.location==="siedlung"&&g.water.flood.stage==="solved")return "siedlungSafe";
    return g.location;
  }

  function importSaveData(data){
    if(!data || typeof data!=="object" || Array.isArray(data) ||
      !Number.isFinite(data.apples) && !Number.isFinite(data.candies) ||
      !Array.isArray(data.inventory) || !data.flags || typeof data.flags!=="object" ||
      !data.unlocks || typeof data.unlocks!=="object")throw Error("Keine gültige Fulinpach-Sicherung.");
    if(Number.isFinite(data.version) && data.version>VERSION)throw Error("Dieser Spielstand stammt aus einer neueren Spielversion.");
    g=normalizeSave(data);saveGame();
    say("Spielstand importiert. Deine Ernte und Entdeckungen sind wieder da.","good");render();
  }
  function exportSaveJson(){
    saveGame();
    const blob=new Blob([JSON.stringify(g,null,2)],{type:"application/json;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=url;link.download=`Fulinpach-Spielstand-${new Date().toLocaleDateString("sv-SE")}.json`;
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    say("Dein Spielstand wurde als JSON-Datei heruntergeladen.","good");
  }
  async function importSaveJson(file){
    if(!file)throw Error("Wähle zuerst eine JSON-Datei aus.");
    if(file.size>2_000_000)throw Error("Diese Datei ist für einen Fulinpach-Spielstand zu groß.");
    const data=JSON.parse(await file.text());
    importSaveData(data);
  }

    const legacy=document.createElement("details");legacy.className="pouch";
    const summary=document.createElement("summary");summary.textContent="Früheren Text-Spielstand übernehmen";legacy.appendChild(summary);
    const out=document.createElement("textarea");out.id="saveText";out.placeholder="Hier einen alten Exportcode einfügen.";legacy.appendChild(out);
    legacy.appendChild(btn("Alten Textcode importieren",()=>{
      try{const raw=out.value.trim();const data=raw.startsWith("{")?JSON.parse(raw):JSON.parse(decodeURIComponent(escape(atob(raw))));importSaveData(data)}
      catch(e){status.className="bad";status.textContent="Dieser Textcode ist kein gültiger Spielstand.";}
    }));
    s.appendChild(legacy);
    s.appendChild(btn("Alles zurücksetzen",()=>{if(confirm("Wirklich den kompletten Spielstand löschen? Die Äpfel werden sich nicht an dich erinnern.")){g=fresh();saveGame();render()}},false,"danger"));
    const st=document.createElement("pre");st.textContent=`\nTode: ${g.stats.deaths}\nBesiegte Gegner: ${g.stats.enemies}\nGefundene Geheimnisse: ${g.stats.secrets}\n`;s.appendChild(st);

  }

  function escapeHtml(str){return String(str).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

  function keepButtonFocus(update){
    const active=document.activeElement;
    const root=active?.tagName==="BUTTON"?active.closest("#tabs, #topActions, .panel.active"):null;
    if(!root){update();return}
    const label=active.textContent;
    const index=[...root.querySelectorAll("button")].filter(button=>button.textContent===label).indexOf(active);
    update();
    if(index<0||root.classList.contains("panel")&&!root.classList.contains("active"))return;
    const replacement=[...root.querySelectorAll("button")].filter(button=>button.textContent===label)[index];
    if(replacement&&!replacement.disabled)replacement.focus({preventScroll:true});
  }
  function render(){
    keepButtonFocus(()=>{
      updateUnlocks(); recomputeStats(); renderResources();renderTopActions();renderTabs();renderPanels();renderNotice();renderLog();
    });
  }

  function saveGame(){
    g.lastSave=Date.now();
    try{localStorage.setItem(SAVE_KEY,JSON.stringify(g))}catch(e){}
  }

  function normalizeSave(data){
    if(!data || typeof data!=="object" || Array.isArray(data))throw Error("Ungültiger Speicherstand");
    const oldMeta=/bonbon|candy|lolli|fiktiv|erfunden|\bim spiel\b|\bist real\b|\bin dieser geschichte\b/i;
    const old=typeof data.apples!=="number" && typeof data.candies==="number";
    if(old){
      data={...data,apples:data.candies,seeds:data.lollipops||0,cider:data.chocolate||0,
        bark:data.wrappers||0,appleRate:data.candyRate||1,seedRate:data.lollipopRate||0};
    }
    const base=fresh();
    const bought={...(data.shopBought||{})};
    const oldOster=data.water?.oster,oldFlood=data.water?.flood;
    if(bought.lolliMachine){bought.seedCollector=true;delete bought.lolliMachine;}
    const result={...base,...data,
      flags:{...base.flags,...(data.flags||{})},
      unlocks:{...base.unlocks,...(data.unlocks||{})},
      stats:{...base.stats,...(data.stats||{})},
      shopBought:bought,
      water:{oster:{stage:["new","trail","assessed","solved"].includes(oldOster?.stage)?oldOster.stage:"new",solution:["fachstelle","versorgung","gemeinschaft"].includes(oldOster?.solution)?oldOster.solution:null},
        flood:{stage:["new","observed","warned","solved"].includes(oldFlood?.stage)?oldFlood.stage:"new",warning:["nachbarn","gemeinde"].includes(oldFlood?.warning)?oldFlood.warning:null,solution:["treibholz","rueckhalt","hausschutz"].includes(oldFlood?.solution)?oldFlood.solution:null}},
      farm:{selection:typeof data.farm?.selection==="string"&&Object.hasOwn(FARM_VARIETIES,data.farm.selection)?data.farm.selection:"young",
        harvests:Number.isSafeInteger(data.farm?.harvests)?Math.max(0,data.farm.harvests):0,
        plots:Array.from({length:3},(_,i)=>{const p=data.farm?.plots?.[i];return p&&Object.hasOwn(FARM_VARIETIES,p.variety)&&Number.isFinite(p.plantedAt)&&Number.isFinite(p.readyAt)&&p.readyAt>=p.plantedAt?{variety:p.variety,plantedAt:p.plantedAt,readyAt:p.readyAt,watered:Boolean(p.watered)}:null})},
      lore:{opened:{},choices:{}},
      chronicle:{visited:["rathaus"],solved:[]},
      encounters:{},
      notice:data.notice && typeof data.notice==="object" && Array.isArray(data.notice.lines) && data.notice.lines.every(x=>typeof x==="string"&&!oldMeta.test(x)) ?
        {at:Number.isFinite(data.notice.at)?data.notice.at:Date.now(),tab:String(data.notice.tab||"main"),location:String(data.notice.location||"rathaus"),lines:data.notice.lines.slice(-4)}:null,
      inventory:Array.isArray(data.inventory)?data.inventory.map(x=>x==="voidCandy"?"hollowApple":x).filter(x=>typeof x==="string" && Object.hasOwn(itemDb,x)):[],
      equipped:{...base.equipped,...(data.equipped||{})},
      messages:old?["Dein früherer Spielstand wurde übernommen."]:
        (Array.isArray(data.messages)?data.messages.filter(x=>typeof x==="string" && !oldMeta.test(x)).slice(-90):base.messages),
      combat:null,version:VERSION};
    for(const thread of LORE_THREADS){
      const opened=data.lore?.opened?.[thread.id],choice=data.lore?.choices?.[thread.id];
      if(thread.places.includes(opened))result.lore.opened[thread.id]=opened;
      if(choice===1||choice===2)result.lore.choices[thread.id]=choice;
    }
    const visited=Array.isArray(data.chronicle?.visited)?data.chronicle.visited:[];
    const solved=Array.isArray(data.chronicle?.solved)?data.chronicle.solved:[];
    result.chronicle.visited=[...new Set(["rathaus",...visited.filter(x=>CHRONICLE.some(entry=>entry.place===x)||ENCOUNTERS.some(scene=>scene.place===x))])];
    result.chronicle.solved=[...new Set(solved.filter(x=>CHRONICLE.some(entry=>entry.id===x)))];
    for(const scene of ENCOUNTERS){
      const choice=data.encounters?.[scene.id];
      if(scene.choices.some(x=>x.id===choice)){result.encounters[scene.id]=choice;result.chronicle.visited.push(scene.place)}
    }
    result.chronicle.visited=[...new Set(result.chronicle.visited)];
    if(Number.isFinite(data.version)&&data.version<10){
      if(result.flags.ending){result.chronicle.solved.push("fulinpah980","bahn1897");result.chronicle.visited.push("bahnhof")}
      if(result.flags.mannlGift||result.flags.fulinpachVisited||result.flags.finalWon||result.flags.finalChoice){result.chronicle.solved.push("gemeinde1978","apfel1992");result.chronicle.visited.push("au","markt")}
      result.chronicle.solved=[...new Set(result.chronicle.solved)];result.chronicle.visited=[...new Set(result.chronicle.visited)];
    }
    if(!Number.isFinite(data.version)||data.version<9){
      if(result.flags.wirtsalmWon||result.flags.ending)for(const id of ["name","moor","water"]){result.lore.choices[id]??=1;result.lore.opened[id]??=LORE_THREADS.find(x=>x.id===id).places[0]}
      if(result.flags.mannlGift||result.flags.finalWon)for(const id of ["harvest","promise","mountain"]){result.lore.choices[id]??=1;result.lore.opened[id]??=LORE_THREADS.find(x=>x.id===id).places[0]}
    }
    for(const key of ["apples","seeds","cider","bark","appleRate","seedRate","hp","maxHp","eaten","thrown","insuranceBonus"]){
      if(!Number.isFinite(result[key]))result[key]=base[key];
      result[key]=Math.max(0,Math.min(1e12,result[key]));
    }
    if(result.maxHp<1){result.maxHp=base.maxHp;result.hp=base.hp}
    if(old)result.insuranceBonus=Math.max(0,result.maxHp-100-Math.floor(result.eaten/20)*2-(result.flags.candleLit?10:0));
    result.hp=Math.max(1,Math.min(result.maxHp,result.hp));
    const tabUnlocks={farm:"farm",shop:"shop",inventory:"inventory",map:"map",quests:"quests",box:"box"};
    if(!["main","farm","shop","inventory","map","journal","quests","box","save"].includes(result.currentTab)||
       tabUnlocks[result.currentTab]&&!result.unlocks[tabUnlocks[result.currentTab]])result.currentTab="main";
    if(!["rathaus","kirche","filze","bahnhof","jenbach","osterbach","biberdamm","siedlung","wall","tregler","wirtsalm","markt","wiechs","au","litzldorf","farrenpoint","wendelstein","fulinpach"].includes(result.location))result.location="rathaus";
    if(result.inventory.includes("ratCrown") && !result.equipped.head){
      result.equipped.head="ratCrown";
      if(result.equipped.trinket==="ratCrown")result.equipped.trinket=null;
    }
    for(const {id} of EQUIPMENT_SLOTS){
      if(!result.inventory.includes(result.equipped[id]) || gearSlot(result.equipped[id])!==id)
        result.equipped[id]=null;
    }
    if(result.flags.ending)result.unlocks.map=true;
    if(result.flags.crateInspected)result.unlocks.farm=true;
    g=result;recomputeStats();return result;
  }

  function loadGame(){
    try{
      const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem(OLD_SAVE_KEY); if(!raw)return;
      normalizeSave(JSON.parse(raw));
      const elapsed=Math.min(8*3600,Math.max(0,(Date.now()-(g.lastTick||Date.now()))/1000));
      g.apples+=elapsed*g.appleRate; g.seeds+=elapsed*g.seedRate;
      if(elapsed>30)say(`Während du weg warst, produzierte die Kiste ${fmt(elapsed*g.appleRate)} Äpfel. Überstunden wurden nicht genehmigt.`);
      g.lastTick=Date.now();
      saveGame();
    }catch(e){g=fresh()}
  }

  $("title").onclick=()=>{
    g.flags.titleClicks++;
    if(g.flags.titleClicks===5 && !g.flags.tooth){g.flags.tooth=true;g.stats.secrets++;addItem("tooth");say("Hör auf, die Überschrift anzuklicken.","secret")}
    else if(g.flags.titleClicks===9)say("Ernsthaft.","secret");
    else if(g.flags.titleClicks===13)say("Gut. Dafür gibt es keinen Erfolg. Vermutlich.","secret");
    render();
  };

  let last=Date.now();
  function loop(){
    const now=Date.now(), dt=Math.max(0,Math.min(.5,(now-last)/1000)); last=now;
    const previousUnlocks=Object.values(g.unlocks).join("");
    const wasFighting=Boolean(g.combat);
    g.apples+=g.appleRate*dt; g.seeds+=g.seedRate*dt; g.lastTick=now;
    combatTick(now); updateUnlocks();
    if(now-(g.lastSave||0)>5000)saveGame();
    if(previousUnlocks!==Object.values(g.unlocks).join("") || (wasFighting&&!g.combat)){
      render();
      requestAnimationFrame(loop);
      return;
    }
    renderResources();
    if(g.combat && g.currentTab==="quests" && Math.floor(now/200)!==Math.floor((now-dt*1000)/200))keepButtonFocus(renderQuests);
    if(Math.floor(now/500)!==Math.floor((now-dt*1000)/500)){
      renderTopActions();
      if(g.currentTab==="farm")updateFarmTimers();
      if(g.currentTab==="shop")keepButtonFocus(renderShop);
      if(g.currentTab==="quests" && !g.combat)keepButtonFocus(renderQuests);
    }
    requestAnimationFrame(loop);
  }

  const fallingApple=resourceGraphic("apples");fallingApple.className="falling-apple";$("mainStage").appendChild(fallingApple);
  loadGame(); render(); requestAnimationFrame(loop);
})();
</script>
